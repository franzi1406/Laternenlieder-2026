<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <title>Laternenlieder</title>
  <style>
    :root { color-scheme: light; --ink: #292720; --muted: #6e6a60; --paper: #f7f3eb; --line: #e4ded2; --accent: #8a4b2a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); }
    header { text-align: center; padding: 18px 12px 24px; }
    .lantern { font-size: 2rem; margin-bottom: 8px; }
    h1 { font-size: clamp(2rem, 7vw, 2.8rem); letter-spacing: -.04em; margin: 0; }
    .subtitle { margin: 10px 0 0; color: var(--muted); }
    ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.song { display: flex; align-items: center; gap: 14px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 14px; color: inherit; background: #fffdf9; text-decoration: none; box-shadow: 0 2px 8px #29272008; transition: transform .15s ease, border-color .15s ease; }
    a.song:hover, a.song:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
    .number { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; background: #efe3d5; color: var(--accent); font-weight: 700; }
    .song-label { flex: 1; font-weight: 650; }
    .play { color: var(--accent); font-size: 1.1rem; }
    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 22px 8px 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="lantern" aria-hidden="true">🏮</div>
      <h1>Laternenlieder</h1>
      <p class="subtitle">Vier Lieder zum gemeinsamen Singen</p>
    </header>
    <ol>
      <li><a class="song" href="https://youtu.be/XfIoPKkri9k?feature=shared" target="_blank" rel="noopener noreferrer"><span class="number">1</span><span class="song-label">Jedes kleine Leuchten</span><span class="play" aria-hidden="true">▶</span></a></li>
      <li><a class="song" href="https://youtu.be/u2LzNH_NPrU?feature=shared" target="_blank" rel="noopener noreferrer"><span class="number">2</span><span class="song-label">Durch die Straßen auf und nieder</span><span class="play" aria-hidden="true">▶</span></a></li>
      <li><a class="song" href="https://youtu.be/Wm-w6mtoI3Q?feature=shared" target="_blank" rel="noopener noreferrer"><span class="number">3</span><span class="song-label">Kommt wir wolln Laterne laufen</span><span class="play" aria-hidden="true">▶</span></a></li>
      <li><a class="song" href="https://youtu.be/ZtU-lZpX27o?feature=shared" target="_blank" rel="noopener noreferrer"><span class="number">4</span><span class="song-label">Lichterkinder</span><span class="play" aria-hidden="true">▶</span></a></li>
    </ol>
    <footer>Einfach ein Lied auswählen und auf „Play“ tippen.</footer>
  </main>
</body>
</html>
